<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — {{APP_NAME}}</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#101726">
<link rel="icon" href="{{SITE_URL}}assets/img/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(224, 163, 62, 0.22), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(43, 140, 133, 0.26), transparent 55%),
      #101726;
    color: #f8f3e7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; text-align: center; }
  .code {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: clamp(4rem, 14vw, 7rem);
    line-height: 1;
    margin: 0 0 8px;
    color: #e0a33e;
    letter-spacing: -0.04em;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin: 0 0 14px;
  }
  p { color: rgba(248, 243, 231, 0.7); margin: 0 0 28px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a {
    display: inline-block;
    padding: 12px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    color: #f8f3e7;
    border: 1px solid rgba(255, 255, 255, 0.18);
  }
  a.primary { background: #e0a33e; border-color: #e0a33e; color: #2b1c00; }
  a:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page is missing from the shelf</h1>
  <p>The link may be old, or the page may have moved. Head back to the homepage to keep reading.</p>
  <div class="actions">
    <a class="primary" href="{{SITE_URL}}">Back to the homepage</a>
    <a href="{{SITE_URL}}support.html">Support</a>
  </div>
</main>
</body>
</html>
